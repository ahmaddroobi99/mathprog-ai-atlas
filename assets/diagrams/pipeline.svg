<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Predict then decide pipeline</title>
  <desc id="desc">Real world to learned model to mathematical program to decision to action.</desc>
  <rect width="960" height="220" fill="#0b1220"/>
  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="70" width="150" height="80" rx="14" fill="#152238" stroke="#7dd3fc" stroke-width="2"/>
    <text x="95" y="116" fill="#e2e8f0" font-size="16">Real world</text>
    <rect x="210" y="70" width="160" height="80" rx="14" fill="#152238" stroke="#38bdf8" stroke-width="2"/>
    <text x="290" y="108" fill="#e2e8f0" font-size="16">ML prediction</text>
    <text x="290" y="128" fill="#93c5fd" font-size="11">scores / costs</text>
    <rect x="410" y="70" width="200" height="80" rx="14" fill="#0f2744" stroke="#22d3ee" stroke-width="2"/>
    <text x="510" y="108" fill="#e2e8f0" font-size="16">Math program</text>
    <text x="510" y="128" fill="#67e8f9" font-size="11">objective + constraints</text>
    <rect x="650" y="70" width="140" height="80" rx="14" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
    <text x="720" y="116" fill="#dcfce7" font-size="16">Decision</text>
    <rect x="830" y="70" width="110" height="80" rx="14" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
    <text x="885" y="116" fill="#fef3c7" font-size="16">Action</text>
    <path d="M170 110 H210" stroke="#94a3b8" stroke-width="2"/>
    <path d="M370 110 H410" stroke="#94a3b8" stroke-width="2"/>
    <path d="M610 110 H650" stroke="#94a3b8" stroke-width="2"/>
    <path d="M790 110 H830" stroke="#94a3b8" stroke-width="2"/>
  </g>
</svg>
